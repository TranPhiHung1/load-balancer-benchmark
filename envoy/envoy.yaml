static_resources:
  listeners:
    - name: http_listener
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 80
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: ingress_http
                route_config:
                  name: local_route
                  virtual_hosts:
                    - name: backend_service
                      domains:
                        - "*"
                      routes:
                        - match:
                            path: /api/wrr
                            case_sensitive: true
                          route:
                            cluster: weighted_backend_cluster
                            prefix_rewrite: /api
                            retry_policy:
                              retry_on: connect-failure
                              num_retries: 1
                              retry_host_predicate:
                                - name: envoy.retry_host_predicates.previous_hosts
                                  typed_config:
                                    "@type": type.googleapis.com/envoy.extensions.retry.host.previous_hosts.v3.PreviousHostsPredicate
                              host_selection_retry_max_attempts: 5
                        - match:
                            path: /api/least
                          route:
                            cluster: least_backend_cluster
                            prefix_rewrite: /api
                            retry_policy:
                              retry_on: connect-failure
                              num_retries: 1
                              retry_host_predicate:
                                - name: envoy.retry_host_predicates.previous_hosts
                                  typed_config:
                                    "@type": type.googleapis.com/envoy.extensions.retry.host.previous_hosts.v3.PreviousHostsPredicate
                              host_selection_retry_max_attempts: 5
                        - match:
                            path: /api/iphash
                          request_headers_to_add:
                            - header:
                                key: x-lab-source-ip
                                value: "%DOWNSTREAM_DIRECT_REMOTE_ADDRESS_WITHOUT_PORT%"
                              append_action: OVERWRITE_IF_EXISTS_OR_ADD
                          response_headers_to_add:
                            - header:
                                key: x-lab-source-ip
                                value: "%DOWNSTREAM_DIRECT_REMOTE_ADDRESS_WITHOUT_PORT%"
                              append_action: OVERWRITE_IF_EXISTS_OR_ADD
                          route:
                            cluster: iphash_backend_cluster
                            prefix_rewrite: /api
                            hash_policy:
                              - header:
                                  header_name: x-lab-source-ip
                            retry_policy:
                              retry_on: connect-failure
                              num_retries: 1
                              retry_host_predicate:
                                - name: envoy.retry_host_predicates.previous_hosts
                                  typed_config:
                                    "@type": type.googleapis.com/envoy.extensions.retry.host.previous_hosts.v3.PreviousHostsPredicate
                              host_selection_retry_max_attempts: 5
                        - match:
                            prefix: /
                          route:
                            cluster: backend_cluster
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
    - name: https_h2_listener
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 443
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: https_h2_listener
                route_config:
                  name: local_route
                  virtual_hosts:
                    - name: backend_service
                      domains:
                        - "*"
                      routes:
                        - match:
                            prefix: /
                          route:
                            cluster: backend_cluster
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
                codec_type: AUTO
          transport_socket:
            name: envoy.transport_sockets.tls
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.DownstreamTlsContext
              common_tls_context:
                alpn_protocols:
                  - h2
                  - http/1.1
                tls_params:
                  tls_minimum_protocol_version: TLSv1_2
                tls_certificates:
                  - certificate_chain:
                      filename: /etc/lb-certs/localhost.crt
                    private_key:
                      filename: /etc/lb-certs/localhost.key
    - name: grpc_listener
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 9443
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: grpc_listener
                route_config:
                  name: local_route
                  virtual_hosts:
                    - name: backend_service
                      domains:
                        - "*"
                      routes:
                        - match:
                            prefix: /
                          route:
                            cluster: grpc_cluster
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
                codec_type: AUTO
          transport_socket:
            name: envoy.transport_sockets.tls
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.DownstreamTlsContext
              common_tls_context:
                alpn_protocols:
                  - h2
                tls_params:
                  tls_minimum_protocol_version: TLSv1_2
                tls_certificates:
                  - certificate_chain:
                      filename: /etc/lb-certs/localhost.crt
                    private_key:
                      filename: /etc/lb-certs/localhost.key
  clusters:
    - name: backend_cluster
      connect_timeout: 5s
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      health_checks:
        - timeout: 2s
          interval: 2s
          unhealthy_threshold: 3
          healthy_threshold: 2
          tcp_health_check: {}
      load_assignment:
        cluster_name: backend_cluster
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: backend-1
                      port_value: 3001
              - endpoint:
                  address:
                    socket_address:
                      address: backend-2
                      port_value: 3002
    - name: weighted_backend_cluster
      connect_timeout: 0.750s
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      common_lb_config:
        healthy_panic_threshold:
          value: 0
      health_checks:
        - timeout: 2s
          interval: 2s
          no_traffic_interval: 2s
          unhealthy_threshold: 3
          healthy_threshold: 2
          tcp_health_check: {}
      load_assignment:
        cluster_name: weighted_backend_cluster
        endpoints:
          - lb_endpoints:
              - load_balancing_weight: 3
                endpoint:
                  address:
                    socket_address:
                      address: backend-1
                      port_value: 3001
              - load_balancing_weight: 1
                endpoint:
                  address:
                    socket_address:
                      address: backend-2
                      port_value: 3002
    - name: least_backend_cluster
      connect_timeout: 0.750s
      type: STRICT_DNS
      load_balancing_policy:
        policies:
          - typed_extension_config:
              name: envoy.load_balancing_policies.least_request
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.load_balancing_policies.least_request.v3.LeastRequest
                selection_method: FULL_SCAN
      common_lb_config:
        healthy_panic_threshold:
          value: 0
      health_checks:
        - timeout: 2s
          interval: 2s
          no_traffic_interval: 2s
          unhealthy_threshold: 3
          healthy_threshold: 2
          tcp_health_check: {}
      load_assignment:
        cluster_name: least_backend_cluster
        endpoints:
          - lb_endpoints:
              - load_balancing_weight: 1
                endpoint:
                  address:
                    socket_address:
                      address: backend-1
                      port_value: 3001
              - load_balancing_weight: 1
                endpoint:
                  address:
                    socket_address:
                      address: backend-2
                      port_value: 3002
    - name: iphash_backend_cluster
      connect_timeout: 0.750s
      type: STRICT_DNS
      lb_policy: RING_HASH
      common_lb_config:
        healthy_panic_threshold:
          value: 0
      health_checks:
        - timeout: 2s
          interval: 2s
          no_traffic_interval: 2s
          unhealthy_threshold: 3
          healthy_threshold: 2
          tcp_health_check: {}
      load_assignment:
        cluster_name: iphash_backend_cluster
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: backend-1
                      port_value: 3001
              - endpoint:
                  address:
                    socket_address:
                      address: backend-2
                      port_value: 3002
    - name: grpc_cluster
      connect_timeout: 5s
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      health_checks:
        - timeout: 2s
          interval: 2s
          unhealthy_threshold: 3
          healthy_threshold: 2
          tcp_health_check: {}
      load_assignment:
        cluster_name: grpc_cluster
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: backend-1
                      port_value: 50051
              - endpoint:
                  address:
                    socket_address:
                      address: backend-2
                      port_value: 50051
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config:
            http2_protocol_options: {}
