events {
}

http {
    upstream grpc_backends {
        server backend-1:50051;
        server backend-2:50051;
    }

    server {
        listen 443 ssl;
        http2 on;
        ssl_certificate /etc/lb-certs/localhost.crt;
        ssl_certificate_key /etc/lb-certs/localhost.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        location /api {
            proxy_pass http://backend_servers;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }

    server {
        listen 9443 ssl;
        http2 on;
        ssl_certificate /etc/lb-certs/localhost.crt;
        ssl_certificate_key /etc/lb-certs/localhost.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        location /benchmark.GreeterService/ {
            grpc_pass grpc://grpc_backends;
        }
    }

    upstream backend_servers {
        server backend-1:3001 max_fails=3 fail_timeout=5s;
        server backend-2:3002 max_fails=3 fail_timeout=5s;
    }

    upstream weighted_backends {
        zone weighted_backends 64k;
        server backend-1:3001 weight=3 max_fails=3 fail_timeout=5s;
        server backend-2:3002 weight=1 max_fails=3 fail_timeout=5s;
    }

    upstream least_backends {
        zone least_backends 64k;
        least_conn;
        server backend-1:3001 weight=1 max_fails=3 fail_timeout=5s;
        server backend-2:3002 weight=1 max_fails=3 fail_timeout=5s;
    }

    upstream iphash_backends {
        zone iphash_backends 64k;
        ip_hash;
        resolver 127.0.0.11 valid=2s ipv6=off;
        server backend-1:3001 resolve max_fails=3 fail_timeout=5s;
        server backend-2:3002 resolve max_fails=3 fail_timeout=5s;
    }

    server {
        listen 80;

        location = /api/iphash {
            proxy_pass http://iphash_backends/api;
            proxy_connect_timeout 750ms;
            proxy_set_header Host $host;
            proxy_hide_header X-Lab-Source-IP;
            add_header X-Lab-Source-IP $remote_addr always;
        }

        location = /api/least {
            proxy_pass http://least_backends/api;
            proxy_connect_timeout 750ms;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location = /api/wrr {
            proxy_pass http://weighted_backends/api;
            proxy_connect_timeout 750ms;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api {
            proxy_pass http://backend_servers;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
