events {
}

http {
    upstream backend_servers {
        server backend-1:3001 max_fails=3 fail_timeout=5s;
        server backend-2:3002 max_fails=3 fail_timeout=5s;
    }

    server {
        listen 80;

        location /api {
            proxy_pass http://backend_servers;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}