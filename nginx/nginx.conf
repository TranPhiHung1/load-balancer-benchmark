events {
}

http {
    upstream grpc_backends {
        server backend-1:50051;
        server backend-2:50051;
    }

    server {
        listen 443 ssl;
        http2 on;
        ssl_certificate /etc/lb-certs/localhost.crt;
        ssl_certificate_key /etc/lb-certs/localhost.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        location /api {
            proxy_pass http://backend_servers;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }

    server {
        listen 9443 ssl;
        http2 on;
        ssl_certificate /etc/lb-certs/localhost.crt;
        ssl_certificate_key /etc/lb-certs/localhost.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        location /benchmark.GreeterService/ {
            grpc_pass grpc://grpc_backends;
        }
    }

    upstream backend_servers {
        server backend-1:3001 max_fails=3 fail_timeout=5s;
        server backend-2:3002 max_fails=3 fail_timeout=5s;
    }

    server {
        listen 80;

        location /api {
            proxy_pass http://backend_servers;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
