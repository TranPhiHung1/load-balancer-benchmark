global
    log stdout format raw local0

defaults
    log global
    mode http
    option httplog
    timeout connect 5s
    timeout client 30s
    timeout server 30s  

frontend http_front
    bind *:80
    default_backend app_backends

backend app_backends
    balance roundrobin
    server backend1 backend-1:3001 check inter 2s fall 3 rise 2
    server backend2 backend-2:3002 check inter 2s fall 3 rise 2

