global
    log stdout format raw local0

defaults
    log global
    mode http
    option httplog
    timeout connect 5s
    timeout client 30s
    timeout server 30s  

frontend http_front
    bind *:80
    use_backend weighted_backends if { path /api/wrr }
    use_backend least_backends if { path /api/least }
    use_backend iphash_backends if { path /api/iphash }
    default_backend app_backends

backend app_backends
    balance roundrobin
    server backend1 backend-1:3001 check inter 2s fall 3 rise 2
    server backend2 backend-2:3002 check inter 2s fall 3 rise 2

backend weighted_backends
    balance roundrobin
    timeout connect 1s
    http-request set-path /api
    server backend1 backend-1:3001 weight 3 check inter 2s fall 3 rise 2
    server backend2 backend-2:3002 weight 1 check inter 2s fall 3 rise 2

backend least_backends
    balance leastconn
    timeout connect 1s
    http-request set-path /api
    server backend1 backend-1:3001 weight 1 check inter 2s fall 3 rise 2
    server backend2 backend-2:3002 weight 1 check inter 2s fall 3 rise 2

resolvers iphash_dns
    nameserver docker 127.0.0.11:53
    hold valid 2s

backend iphash_backends
    balance source
    hash-type consistent sdbm avalanche
    timeout connect 750ms
    retries 1
    option redispatch 1
    http-request set-path /api
    http-response set-header X-Lab-Source-IP %[src]
    server backend1 backend-1:3001 id 1 check inter 2s fall 3 rise 2 resolvers iphash_dns resolve-prefer ipv4 init-addr libc,none
    server backend2 backend-2:3002 id 2 check inter 2s fall 3 rise 2 resolvers iphash_dns resolve-prefer ipv4 init-addr libc,none

frontend https_h2_front
    bind *:443 ssl crt /etc/lb-certs/localhost.pem alpn h2,http/1.1
    default_backend app_backends

frontend grpc_front
    bind *:9443 ssl crt /etc/lb-certs/localhost.pem alpn h2
    default_backend grpc_backends

backend grpc_backends
    balance roundrobin
    server grpc1 backend-1:50051 check proto h2
    server grpc2 backend-2:50051 check proto h2

