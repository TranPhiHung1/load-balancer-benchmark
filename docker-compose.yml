services:
  backend-1:
    build: ./backend/backend-1
    container_name: backend-1
    ports:
      - "3001:3001"

  backend-2:
    build: ./backend/backend-2
    container_name: backend-2
    ports:
      - "3002:3002"

  nginx:
    image: nginx:latest
    container_name: nginx-lb
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro