services:
  backend-1:
    build:
      context: ./backend
      dockerfile: backend-1/Dockerfile
    container_name: backend-1
    ports:
      - "3001:3001"

  backend-2:
    build:
      context: ./backend
      dockerfile: backend-2/Dockerfile
    container_name: backend-2
    ports:
      - "3002:3002"

  nginx:
    image: nginx:latest
    container_name: nginx-lb
    ports:
      - "8080:80"
      - "8440:443"
      - "9440:9443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/lb-certs:ro
    depends_on:
      - backend-1
      - backend-2


  haproxy:
    image: haproxy:latest
    container_name: haproxy-lb
    ports:
      - "8081:80"
      - "8441:443"
      - "9441:9443"
    volumes:
      - ./haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
      - ./certs:/etc/lb-certs:ro
    depends_on:
      - backend-1
      - backend-2

  envoy:
    image: envoyproxy/envoy:v1.39-latest
    container_name: envoy-lb
    ports:
      - "8082:80"
      - "8442:443"
      - "9442:9443"
    volumes:
      - ./envoy/envoy.yaml:/etc/envoy/envoy.yaml:ro
      - ./certs:/etc/lb-certs:ro
    depends_on:
      - backend-1
      - backend-2
